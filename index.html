<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Loading</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
overflow:hidden;
color:white;
display:flex;
justify-content:center;
align-items:center;
background:#000;
}

/* BACKGROUND */
.bg{
position:absolute;
width:100%;
height:100%;
background:url('poster.jpg') center/cover no-repeat;
animation:zoom 20s ease-in-out infinite alternate;
filter:brightness(0.5);
}

/* fallback */
.bg::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(45deg,#111,#000);
opacity:0.6;
}

/* ZOOM */
@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* OVERLAY */
.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

/* CONTAINER */
.container{
position:relative;
z-index:2;
text-align:center;
width:90%;
max-width:350px;
}

/* TICKET */
.ticket{
background:rgba(0,0,0,0.75);
padding:20px;
border-radius:15px;
box-shadow:0 0 25px rgba(255,77,45,0.5);
margin-bottom:20px;
animation:fadeIn 1.5s ease;
backdrop-filter:blur(6px);
}

.ticket h1{
color:#ff4d2d;
text-shadow:2px 2px 0 black;
font-size:22px;
}

.ticket p{
font-size:12px;
opacity:0.85;
}

/* PROGRESS */
.progress-box{
width:100%;
height:10px;
background:#222;
border-radius:20px;
overflow:hidden;
margin:auto;
}

.progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#ff4d2d,#00ffcc,#ffd700);
transition:width 0.1s linear;
}

/* STATUS */
#status{
margin-top:12px;
font-size:13px;
color:#00ffcc;
}

/* TERMINAL */
#terminal{
margin-top:10px;
font-size:11px;
color:#00ffcc;
height:60px;
overflow:hidden;
line-height:1.4;
}

/* FADE OUT */
.fadeOut{
animation:fade 1s forwards;
}
@keyframes fade{
to{opacity:0;}
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">

<div class="ticket">
<h1>SHEILA ON 7</h1>
<p>BALI • 04.07.2026</p>
<p>Bali United Training Center</p>
</div>

<div class="progress-box">
<div class="progress" id="progress"></div>
</div>

<div id="status">Initializing Event System...</div>
<div id="terminal"></div>

</div>

<script>
let duration = 8000; // 8 detik (ubah ke 30000 kalau mau 30 detik)
let startTime = performance.now();

const progressBar = document.getElementById("progress");
const terminal = document.getElementById("terminal");
const statusText = document.getElementById("status");

const logs = [
"Connecting to POLIPONI Server...",
"Scanning ticket database...",
"Verifying access...",
"Synchronizing event data...",
"Finalizing system..."
];

let logIndex = 0;

function updateProgress(now){
let elapsed = now - startTime;
let progress = Math.min((elapsed / duration) * 100, 100);

// update bar
progressBar.style.width = progress + "%";

// update log bertahap
if(logIndex < logs.length && progress > (logIndex + 1) * 20){
addLog(logs[logIndex]);
logIndex++;
}

// selesai
if(progress >= 100){
statusText.innerText = "ACCESS GRANTED";

setTimeout(()=>{
document.body.classList.add("fadeOut");

setTimeout(()=>{
// redirect utama
window.location.href = "https://poliponi.github.io/DESKRIPSI/index.html";

// fallback kalau gagal
setTimeout(()=>{
window.location.replace("https://hariadig68-wq.github.io/Festivalbali/");
},1500);

},1000);

},1500);

return;
}

requestAnimationFrame(updateProgress);
}

function addLog(text){
let line = document.createElement("div");
line.textContent = text;
terminal.appendChild(line);

if(terminal.children.length > 5){
terminal.removeChild(terminal.firstChild);
}
}

// START
requestAnimationFrame(updateProgress);

// BACKUP REDIRECT (anti gagal total)
setTimeout(()=>{
window.location.href = "https://poliponi.github.io/DESKRIPSI/";
},15000);

</script>

</body>
</html>
